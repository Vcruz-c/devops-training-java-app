# Nombre del workflow que aparecerá en la pestaña Actions de GitHub
name: CI/CD Java

# on: define CUÁNDO se ejecuta el workflow
on:
  # Se ejecuta en cualquier push a cualquier rama
  push:
  # Se ejecuta cuando se abre o actualiza un Pull Request hacia develop o master
  pull_request:
    branches: [develop, master]
  # Permite lanzarlo manualmente desde la UI de GitHub (Actions -> Run workflow)
  workflow_dispatch:
    inputs:
      # Parámetro manual: si se activa, fuerza la ejecución del job CD
      RUN_CD:
        description: "Run CD stage"
        required: false
        type: boolean
        default: false

# jobs: unidades de trabajo del pipeline (equivalente a stages en Jenkins)
jobs:

  # Job de CI (Integración Continua): lint + test + build
  # Se ejecuta siempre, en cualquier rama y en cualquier push
  ci:
    # Runner: máquina virtual de GitHub donde se ejecuta el job
    # ubuntu-latest = Ubuntu con Docker ya instalado
    runs-on: ubuntu-latest
    steps:
      # Clona el repositorio en el runner para que los pasos siguientes tengan acceso al código
      - uses: actions/checkout@v4

      # Muestra información útil del contexto: rama actual y commit SHA
      - name: Info
        run: |
          echo "branch=${GITHUB_REF_NAME}"
          echo "sha=${GITHUB_SHA}"

      # Construye la imagen Docker de CI a partir de devops/ci.Dockerfile
      # Esta imagen tiene maven + make instalados para ejecutar lint y test
      # Equivalente al agent { docker { image 'maven...' } } de Jenkins
      - name: Build CI image
        run: docker build -t java-ci-image -f devops/ci.Dockerfile .

      # Ejecuta make lint dentro del contenedor de CI
      # -v monta el código del repo dentro del contenedor en /workspace
      # -w establece /workspace como directorio de trabajo
      # --rm elimina el contenedor al terminar
      - name: Lint
        run: docker run --rm -v $(pwd):/workspace -w /workspace java-ci-image make lint

      # Ejecuta los tests unitarios dentro del mismo contenedor de CI
      - name: Test
        run: docker run --rm -v $(pwd):/workspace -w /workspace java-ci-image make test

      # Construye la imagen Docker final de la aplicación
      # Equivalente al stage "Build" del Jenkinsfile
      # --build-arg pasa la versión como argumento al Dockerfile
      - name: Build app image
        run: docker build -t scalian_training-java-hello-world:0.0.2 --build-arg VERSION=0.0.1-SNAPSHOT -f devops/Dockerfile .

  # Job de CD (Despliegue Continuo): deploy + e2e + cleanup
  # Solo se ejecuta si:
  #   - Se lanzó manualmente con RUN_CD=true, O
  #   - La rama es develop o master
  # Equivalente al when { branch 'develop' } de Jenkins
  cd:
    # Este job necesita que el job ci termine correctamente antes de ejecutarse
    needs: ci
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.RUN_CD == true || github.ref_name == 'develop' || github.ref_name == 'master' }}
    runs-on: ubuntu-latest
    steps:
      # Clona el repositorio (necesario en cada job, no se comparte estado entre jobs)
      - uses: actions/checkout@v4